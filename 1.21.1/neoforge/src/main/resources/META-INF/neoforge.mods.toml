modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}"
issueTrackerURL="https://github.com/MeherBenSalem/Ascendant-Mobs/issues"
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL="https://github.com/MeherBenSalem/Ascendant-Mobs"
logoFile = "logo.png" #optional
iconFile = "${mod_id}.png" #optional
credits="${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
[[mixins]]
config = "${mod_id}.mixins.json"
[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${neoforge_version},)" #mandatory
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "rpg_attribute_system"
type="optional"
versionRange = "[4.0,)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "rpgmoblevelingsystem"
type="incompatible"
reason="Remnants: RPG Mobs replaces RPG Mob Leveling System; remove the old jar."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
