plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation files(rootProject.file("libs/jauml-fabric-1.20.1-1.2.0.jar"))
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
    // Soft-dep: compile against Neat for mixin; runtime copy keeps JiJ (Fiber) intact
    modCompileOnly "maven.modrinth:neat:${neat_fabric_version}"
}

def neatFabricDep = dependencies.create("maven.modrinth:neat:${neat_fabric_version}")
configurations {
    neatRuntimeJar {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    neatRuntimeJar neatFabricDep
}

tasks.register('copyNeatForRunClient', Copy) {
    from({ configurations.neatRuntimeJar.singleFile })
    into(layout.projectDirectory.dir('run/mods'))
    rename { 'neat-dev.jar' }
}

tasks.named('runClient') {
    dependsOn('copyNeatForRunClient')
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
