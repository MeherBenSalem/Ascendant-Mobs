# Publish Remnants: RPG Mobs to CurseForge (NightBeam convention: CurseForge only since 24 Nov 2026).
#
# Runs only by hand (workflow_dispatch) or on a v*.*.* tag; a push to main never releases anything.
# Uses exactly the 8 convention jars for the version, in this order of sources:
#   1. releases/remnant_mobs-<loader>-<minecraft>-<version>.jar committed to the repo,
#   2. the jars attached to the GitHub Release v<version>,
#   3. a build from source: ./gradlew buildAll (the workspaces must be at <version>).
# The run fails unless all 8 are found: 1.20.1 Fabric + Forge; 1.21.1, 26.2 and 26.3 Fabric + NeoForge.
#
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops the run if this mod already had a
# release today (Africa/Tunis day), on CurseForge or in an earlier Publish run. A dry run only reports it.
# It runs before building and again right before the upload, whatever the inputs below say.
#
# Repo secrets: CURSEFORGE_TOKEN (upload token), CURSEFORGE_API_KEY (Core API key, for the same-day guard)
# Repo variable: CURSEFORGE_ID
# The existing Modrinth project stays up as it is but gets no new versions.
#
# Prove it first:  gh workflow run publish.yml -f version=3.2.1 -f dry_run=true
# Release:         gh workflow run publish.yml -f version=3.2.1   (or: git tag v3.2.1 && git push origin v3.2.1)

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging; matches jar names / GitHub Release
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      minecraft_version:
        description: "Optional: upload only this Minecraft version's jars (1.20.1, 1.21.1, 26.2 or 26.3); the same-day guard still applies"
        required: false

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$VERSION_INPUT" ]]; then
            echo "version=${VERSION_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test publisher scripts
        run: node --test scripts/*.test.mjs

      - name: Same-day guard
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the 8 convention names are ever picked up; anything else for this version is ignored.
          mapfile -t NAMES < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          found=0
          for name in "${NAMES[@]}"; do
            if [ -f "releases/$name" ]; then
              cp -f "releases/$name" dist/
              found=$((found + 1))
            fi
          done
          if [ "$found" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $found prebuilt jar(s) from releases/"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No convention jars for ${VERSION} in releases/; will try the GitHub Release, then build from source"
          fi

      - name: Download GitHub release jars
        id: ghrelease
        if: steps.prebuilt.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          patterns=()
          while IFS= read -r name; do patterns+=(--pattern "$name"); done < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "v${VERSION}" --repo "${{ github.repository }}" --dir dist --clobber "${patterns[@]}" || true
          fi
          count=$(find dist -maxdepth 1 -name 'remnant_mobs-*.jar' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $count jar(s) from GitHub Release v${VERSION}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub Release jars for v${VERSION}; building from source"
          fi

      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'

      - name: Build from source
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check_targets.py workspaces
          ws_version="$(python3 scripts/check_targets.py version)"
          if [ "$ws_version" != "$VERSION" ]; then
            echo "::error::The workspaces are at ${ws_version}, not ${VERSION}. Bump them first (./gradlew syncVersion -PmodVersion=${VERSION})."
            exit 1
          fi
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
          python3 scripts/check_targets.py jars --version "$VERSION" --dir releases --list-file built-jars.txt
          mkdir -p dist
          xargs -a built-jars.txt cp -f -t dist/

      - name: Verify release jars
        id: jars
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MC_FILTER: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          # Exactly the 8 convention jars, one per loader + Minecraft pair, or the run stops here.
          python3 scripts/check_targets.py jars --version "$VERSION" --dir dist --list-file jar-list.txt
          mapfile -t JARS < jar-list.txt
          if [ -n "$MC_FILTER" ]; then
            case "$MC_FILTER" in
              1.20.1|1.21.1|26.2|26.3) ;;
              *) echo "::error::minecraft_version must be 1.20.1, 1.21.1, 26.2 or 26.3, not ${MC_FILTER}"; exit 1 ;;
            esac
            FILTERED=()
            for jar in "${JARS[@]}"; do
              if [[ "$(basename "$jar")" == remnant_mobs-*-"${MC_FILTER}"-"${VERSION}".jar ]]; then
                FILTERED+=("$jar")
              fi
            done
            JARS=("${FILTERED[@]}")
            echo "Uploading only Minecraft ${MC_FILTER}:"
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*.jar

      - name: Load release changelog
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # This version's own notes (patchnotes/<version>.md) first, then the GitHub Release body.
          if [ -f "patchnotes/${VERSION}.md" ]; then
            notes="$(cat "patchnotes/${VERSION}.md")"
          else
            notes="$(gh release view "v${VERSION}" --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null || true)"
          fi
          if [ -z "${notes// }" ]; then
            notes="## Remnants: RPG Mobs ${VERSION}

          See https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$notes" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
          CHANGELOG: ${{ steps.notes.outputs.changelog }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CURSEFORGE_ID:-}" || { echo "Set the repo variable CURSEFORGE_ID" >&2; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const changelog = process.env.CHANGELOG || `## Remnants: RPG Mobs ${version}\n\nSee GitHub release notes.`;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);

          function parseJar(jar) {
            const n = path.basename(jar);
            let loader = 'fabric';
            if (/neoforge/i.test(n)) loader = 'neoforge';
            else if (/forge/i.test(n)) loader = 'forge';
            else if (/fabric/i.test(n)) loader = 'fabric';
            const m = n.match(/^remnant_mobs-(?:fabric|forge|neoforge)-(.+)-(\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?)\.jar$/i);
            const game = m ? m[1] : null;
            return { jar, name: n, loader, game };
          }

          const parsed = jars.map(parseJar);
          for (const p of parsed) {
            if (!p.game) throw new Error('Cannot parse MC version from ' + p.name);
          }
          // Fabric builds need Fabric API (CurseForge slug fabric-api).
          const curseforgeRelations = (p) => (p.loader === 'fabric' ? { projects: [{ slug: 'fabric-api', type: 'requiredDependency' }] } : undefined);

          (async () => {
            const LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150 };
            const legacyRes = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            if (!legacyRes.ok) throw new Error('CurseForge legacy versions API ' + legacyRes.status);
            const legacyFlat = await legacyRes.json();
            const findLegacy = (want, preferType) => {
              const hits = legacyFlat.filter((v) => v.name === want);
              if (preferType != null) {
                const hit = hits.find((v) => v.gameVersionTypeID === preferType);
                if (!hit) throw new Error(`No CF legacy version for ${want} (type ${preferType})`);
                return hit.id;
              }
              if (!hits[0]) throw new Error('No CF legacy version for ' + want);
              return hits[0].id;
            };
            const clientId = findLegacy('Client');
            const serverId = findLegacy('Server');
            const resolveGameId = async (game) => {
              const verRes = await fetch(
                `https://api.curseforge.com/v1/minecraft/version/${encodeURIComponent(game)}`,
                { headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY, Accept: 'application/json' } },
              );
              if (verRes.ok) {
                const verJson = await verRes.json();
                const gvId = verJson.data?.gameVersionId;
                if (gvId) {
                  console.log('CF game', game, '-> gameVersionId', gvId);
                  return gvId;
                }
              }
              const typesRes = await fetch('https://api.curseforge.com/v1/games/432/version-types', {
                headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY, Accept: 'application/json' },
              });
              const typeIds = [];
              if (typesRes.ok) {
                const typesJson = await typesRes.json();
                for (const t of typesJson.data || []) {
                  if (/minecraft/i.test(t.name) && !/bukkit|spigot|paper|plugin/i.test(t.name)) {
                    typeIds.push(t.id);
                  }
                }
              }
              typeIds.push(77784, 1);
              const slug = game.replace(/\./g, '-');
              const candidates = legacyFlat.filter((v) => v.name === game || v.slug === slug);
              for (const typeId of typeIds) {
                const hit = candidates.find((v) => v.gameVersionTypeID === typeId);
                if (hit) {
                  console.log('CF game', game, '-> legacy id', hit.id, 'type', hit.gameVersionTypeID);
                  return hit.id;
                }
              }
              throw new Error('No CF game version id for ' + game);
            };

            for (const p of parsed) {
              const gameId = await resolveGameId(p.game);
              const loaderId = LOADER_IDS[p.loader];
              if (!loaderId) throw new Error('Unknown loader for ' + p.name);
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: p.name,
                gameVersions: [clientId, serverId, loaderId, gameId],
                releaseType: 'release',
              };
              const relations = curseforgeRelations(p);
              if (relations) meta.relations = relations;
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(p.jar)]), p.name);
              let cfText = '';
              for (let attempt = 1; attempt <= 4; attempt++) {
                const cfRes = await fetch(
                  `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                  { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
                );
                cfText = await cfRes.text();
                if (cfRes.ok) {
                  console.log('CurseForge OK', p.name, cfText.slice(0, 120));
                  break;
                }
                if ((cfRes.status === 503 || cfRes.status === 429) && attempt < 4) {
                  console.warn('CurseForge', cfRes.status, 'for', p.name, '- retry', attempt);
                  await new Promise((r) => setTimeout(r, 15000 * attempt));
                  continue;
                }
                throw new Error('CurseForge ' + cfRes.status + ' ' + p.name + ' ' + cfText.slice(0, 500));
              }
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
